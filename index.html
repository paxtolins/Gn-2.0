<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving to a New Formula</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --muted-color: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Cyber/Math Grid Background Effect */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 2rem;
            max-width: 500px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--muted-color);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Animated Countdown Ring */
        .countdown-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 2.5rem auto;
        }

        .countdown-number {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        svg {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }

        circle {
            stroke-width: 4px;
            fill: transparent;
        }

        .circle-bg {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .circle-progress {
            stroke: var(--accent-color);
            stroke-dasharray: 339.29; /* 2 * pi * r (r=54) */
            stroke-dashoffset: 0;
            animation: countdown 5s linear forwards;
            filter: drop-shadow(0 0 6px var(--accent-color));
        }

        @keyframes countdown {
            from {
                stroke-dashoffset: 0;
            }
            to {
                stroke-dashoffset: 339.29;
            }
        }

        /* Glassmorphism Manual Link Button */
        .redirect-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--accent-color);
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .redirect-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>We're Upgrading</h1>
        <p>This site has evolved. We are redirecting you to our new math hub in just a moment.</p>

        <div class="countdown-container">
            <div class="countdown-number" id="countdown-text">5</div>
            <svg>
                <circle class="circle-bg" cx="60" cy="60" r="54"></circle>
                <circle class="circle-progress" cx="60" cy="60" r="54"></circle>
            </svg>
        </div>

        <a href="https://schswork.github.io/math/" class="redirect-btn" id="redirect-link">Take me there now &rarr;</a>
    </div>

    <script>
        const targetURL = "https://schswork.github.io/math/";
        let timeLeft = 5;
        const countdownText = document.getElementById('countdown-text');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownText.textContent = timeLeft;
            }
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetURL;
            }
        }, 1000);

        // Fallback safety redirect if the interval experiences lag
        setTimeout(() => {
            window.location.href = targetURL;
        }, 5500);
    </script>

</body>
</html>

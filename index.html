<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_REDIRECT</title>
    <style>
        :root {
            --bg-color: #050000;
            --accent-color: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.5);
            --text-color: #ffffff;
            --muted-color: #a39999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Code Rain Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 2.5rem;
            max-width: 550px;
            background: rgba(5, 0, 0, 0.85);
            border: 1px solid rgba(255, 0, 60, 0.15);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: var(--text-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .terminal-text {
            color: var(--muted-color);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .terminal-text span {
            color: var(--accent-color);
        }

        /* Animated Countdown Ring */
        .countdown-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 2.5rem auto;
        }

        .countdown-number {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        svg {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }

        circle {
            stroke-width: 3px;
            fill: transparent;
        }

        .circle-bg {
            stroke: rgba(255, 0, 60, 0.05);
        }

        .circle-progress {
            stroke: var(--accent-color);
            stroke-dasharray: 339.29; 
            stroke-dashoffset: 0;
            animation: countdown 5s linear forwards;
            filter: drop-shadow(0 0 8px var(--accent-color));
        }

        @keyframes countdown {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 339.29; }
        }

        /* Cyberpunk Terminal Button */
        .redirect-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--accent-color);
            background: transparent;
            border: 1px solid var(--accent-color);
            padding: 0.8rem 2rem;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .redirect-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--accent-glow);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Cyber Background Rain -->
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>[ SYSTEM_REROUTE ]</h1>
        <p class="terminal-text">
            Traffic migration in progress...<br>
            Establishing secure link to: <span>schswork.github.io/math/</span>
        </p>

        <div class="countdown-container">
            <div class="countdown-number" id="countdown-text">5</div>
            <svg>
                <circle class="circle-bg" cx="60" cy="60" r="54"></circle>
                <circle class="circle-progress" cx="60" cy="60" r="54"></circle>
            </svg>
        </div>

        <a href="https://schswork.github.io/math/" class="redirect-btn">FORCE_BYPASS &rarr;</a>
    </div>

    <script>
        // Redirect Logic
        const targetURL = "https://schswork.github.io/math/";
        let timeLeft = 5;
        const countdownText = document.getElementById('countdown-text');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) countdownText.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetURL;
            }
        }, 1000);

        setTimeout(() => { window.location.href = targetURL; }, 5500);

        // Red Matrix Code Rain Script
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Mix of math operators and binary characters
        const charset = "01010110110+-%=≠√πXµ∑Ø".split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 0, 0, 0.05)"; // creates trailing fade effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff003c"; // Red hacker rain
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = charset[Math.floor(Math.random() * charset.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33); // roughly 30 FPS Matrix stream
    </script>

</body>
</html>
